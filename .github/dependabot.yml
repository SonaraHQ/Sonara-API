version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          # A single PR for minor and patch updates, majors get their own
          dependencies:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      groups:
          actions:
              patterns: ["*"]

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: monthly
