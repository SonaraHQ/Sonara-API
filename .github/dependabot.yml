version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          # A single PR for minor and patch updates, majors get their own
          dependencies:
              update-types: [minor, patch]
      ignore:
          # Must match the minimum Node.js version (engines), not the latest one
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      groups:
          actions:
              patterns: ["*"]

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: monthly
      ignore:
          # Moving to another Node.js major (and only to an LTS one) is a manual choice
          - dependency-name: node
            update-types: ["version-update:semver-major"]
